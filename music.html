<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- Custom Context Menu -->
        <div id="custom-context-menu" class="context-menu" style="display: none;">
            <ul id="cm-main">
                <style>
                    #menu-remove:hover {
                        color: #fff;
                    }
                </style>
                <li id="menu-remove" style="color: rgb(202, 64, 64);">Remove</li>
            </ul>
        </div>

        <div id="deletion-prompt-cover" style="display: none;">
            <div id="deletion-prompt-window"> 
                <h2>Are you sure?</h2>
                <p id="deletion-prompt-text">Deleting . . . cannot be undone.</p> 
                <div style="display: flex; flex-direction: row; gap: 10px;">
                    <button id="deletion-prompt-no" class="normal-button">nah, nevermind</button>
                    <button id="deletion-prompt-yes" class="preferable-button">yeah, it sucked anyway</button>
                </div>
            </div>
        </div>

        <!-- name prompt -->
        <div id="name-prompt-cover" style="display: none;">
            <div id="name-prompt-window"> 
                <h2>Enter Playlist Name</h2>
                <p>Every playlist name needs to be unique.</p> 
                <input id="name-input-text-field" type="text">
                <button id="name-input-create-button" class="normal-button">Create</button>
            </div>
        </div>

        <!-- very cool titlebar -->
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p style="font-size: 13px;">v26.0</p>
        </header>

        <!-- content -->
        <div class="main-content">
            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
                <img src="svg/vinyl.svg" class="vinyl" style="bottom: 10px; top: auto; position: absolute;">
            </nav>
            <div id="content">
                <!-- header -->
                <div style="display: flex; flex-direction: row; justify-content: space-between;">
                    <!-- text -->
                    <div>
                        <h1 style="text-indent:25px; margin-bottom: 0;">Music Player</h1>
                        <h3 id="plst-title">Playlist Title</h3>
                    </div>
                    <div style="margin-top: 25px; justify-content: right; justify-items: right;">
                        <h2 id="miniplayer-title" style="font-weight: 400; margin-bottom: 2px;">Song Title</h2>
                        <p id="miniplayer-artist" style="font-weight: 300; margin-top: 0; color: #aaa;">Song Artist</p>
                        <p id="miniplayer-time" style="color: #aaa;">0:00 / 3:30</p>

                        <div id="miniplayer-img-container">
                            <img id="miniplayer-img" src="images/album-cover-placeholder.jpg">
                        </div>
                    </div>
                </div>
                <button id="make-playlist" style="margin-left: 25px;" class="preferable-button">Make Playlist</button>
                <button id="add-songs" style="display: none; margin-left: 25px;" class="preferable-button">Add Songs</button>
                <div class="music-list">
                    <div id="song-item-template" style="display: none;" class="song-item">
                        <img src="images/album-cover-placeholder.jpg">
                        <div>
                            <p class="song-item-title">I Write Sins Not Tragedies</p>
                            <p class="song-item-artist">Panic! at the Disco</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

<script src="javascript/music.js"></script>
<script src="script.js"></script>

<!-- music notes -->
<script>
    function spawnMusicParticle(x, y) {
        const noteSvgs = [
            '<img src="svg/note.svg">'
        ];

        const particle = document.createElement('div');
        particle.classList.add('music-particle');
        
        particle.innerHTML = noteSvgs[Math.floor(Math.random() * noteSvgs.length)];
        
        const randomXOffset = (Math.random() - 0.5) * 40;
        particle.style.left = `${x + randomXOffset}px`;
        particle.style.top = `${y}px`;

        document.body.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 1500);
    }

    document.addEventListener('click', (e) => {
        if (e.target.closest('.vinyl') || e.target.closest('#play-button')) {
            spawnMusicParticle(e.pageX, e.pageY - 30);
        }
    });
</script>
