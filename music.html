<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <!-- name prompt -->
        <div id="name-prompt-cover" style="display: none;">
            <div id="name-prompt-window"> 
                <h2>Enter Playlist Name</h2>
                <p>Every playlist name needs to be unique.</p> 
                <input id="name-input-text-field" type="text">
                <button id="name-input-create-button" class="normal-button">Create</button>
            </div>
        </div>

        <!-- very cool titlebar -->
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p style="font-size: 13px;">v26.0</p>
        </header>

        <!-- content -->
        <div class="main-content">
            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
            </nav>
            <div id="content">
                <h1 style="text-indent:25px;">Music Player</h1>
                <button id="make-playlist" style="margin-left: 25px;" class="preferable-button">Make Playlist</button>
            </div>
        </div>
    </body>
</html>

<script src="javascript/music.js"></script>
<script src="script.js"></script>
