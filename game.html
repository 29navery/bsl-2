<!DOCTYPE html>
<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p style="font-size: 13px;">v26.0</p>
        </header>

        <div class="main-content">
            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
            </nav>
            <div class="hero-container" style="display: flex; flex-direction: row;">
                <style>
                    .button-area {
                        top: 70%;
                        height: 45px;
                        position: absolute;
                        z-index: 10;
                        width: 100%;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                    }
                </style>
                <div id="button-area" class="button-area">
                    <button class="play-button">Play</button>
                </div>
                <img class="logo-image" src="images/logo.png" alt="Logo">
                <img class="hero-image" src="images/hero.png" alt="Hero">
            </div>
        </div>
    </body>
</html>

<script src="script.js"></script>
<script src="javascript/game.js"></script>
