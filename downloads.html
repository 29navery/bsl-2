<!DOCTYPE html>

<html>
    <head>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img src="favicon.ico">
            <p>Big Screen Launcher</p>
            <p style="font-size: 13px;">v26.0</p>
        </header>
        <div class="main-content">
            <nav>
                <button id="library-button"><img class="rail-button-icon" src="svg/library.svg"></button>
                <button id="downloads-button"><img class="rail-button-icon" src="svg/download.svg"></button>
                <button id="settings-button"><img class="rail-button-icon" src="svg/gear.svg"></button>
                <button id="player-button"><img class="rail-button-icon" src="svg/disc.svg"></button>
            </nav>

            <div id="content" style="display: flex; flex-direction: column; gap: 20px;">
                <!--                    -->
                <!--    MAIN CONTENT    -->
                <!--                    -->
                <h1 style="text-indent:25px;">Downloads</h1>
                <div class="downloads-warning-banner">
                    <h2>Download speeds!</h2>
                    <p style="font-size: 15px; color: rgb(231, 218, 177);">These files are literally coming from an OFFICE computer, and the Wi-Fi it's on isn't great! So be mindful when you're downloading games because these speeds will be slow, <strong>especially</strong> when two people are download the same game!</p>
                </div>

                <!-- Action bar -->
                <div class="action-bar">
                    <div id="status-pill" class="server-status"> <div id="status-light"></div> </div>
                    <button id="refresh-button" class="normal-button">Refresh</button>
                    <a id="external-link" class="preferable-button" style="margin-left: auto;">Suggest Games!</a>
                </div>

                <!-- Games -->
                <div id="download-grid" class="download-grid">
                    
                </div>

            </div>
        </div>
    </body>
</html>

<script>
    const { ipcRenderer } = require('electron');

    document.getElementById('external-link').addEventListener('click', function(e) {
        e.preventDefault();
        ipcRenderer.invoke('open-external-link','https://forms.gle/BbEYQQ4ysCWzz9B97');
    });
</script>

<script src="javascript/downloads.js"></script>
<script src="script.js"></script>
